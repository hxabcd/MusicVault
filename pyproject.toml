[project]
name = "musicvault"
version = "0.1.0"
description = "Sync and process NetEase Cloud Music library locally"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 本地构建：修复大歌单 Access Violation 崩溃（上游 issue #3 未修）
    # 构建源：D:\MyPC\Dev\Projects\ncm-python-sdk（分支 fix/playlist-large-response-crash）
    "pymusiclibrary @ file:///D:/MyPC/Dev/Projects/ncm-python-sdk/src/python/dist/pymusiclibrary-0.0.4.post1-cp311-abi3-win_amd64.whl",
    "mutagen>=1.47.0",
    "ncmdump-py>=0.2.0",
    "rich>=13.7.0",
    "qrcode>=8.2",
    "pillow>=11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
musicvault = "musicvault.cli.main:main"
msv = "musicvault.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.coverage.run]
source = ["musicvault"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
